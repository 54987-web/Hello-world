<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>MigrantCare 圖示產生器</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  canvas { display: block; margin: 10px 0; border: 1px solid #ccc; }
  button { padding: 10px 20px; background: #FF6B35; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; font-size: 16px; }
</style>
</head>
<body>
<h2>🏥 MigrantCare 圖示產生器</h2>
<p>點擊按鈕下載圖示，放入 <code>icons/</code> 資料夾</p>
<canvas id="c192" width="192" height="192"></canvas>
<button onclick="download('c192','icon-192.png')">⬇ 下載 icon-192.png</button>
<br>
<canvas id="c512" width="512" height="512"></canvas>
<button onclick="download('c512','icon-512.png')">⬇ 下載 icon-512.png</button>

<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  const r = s * 0.21;
  // 背景圓角矩形
  ctx.fillStyle = '#FF6B35';
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  // 白色十字橫
  const cw = s * 0.54, ch = s * 0.21, cx = (s - cw) / 2, cy = (s - ch) / 2;
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.roundRect(cx, cy, cw, ch, ch * 0.3);
  ctx.fill();
  // 白色十字縱
  const vw = s * 0.21, vh = s * 0.54, vx = (s - vw) / 2, vy = (s - vh) / 2;
  ctx.beginPath();
  ctx.roundRect(vx, vy, vw, vh, vw * 0.3);
  ctx.fill();
  // 文字
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.11}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('Care', s / 2, s * 0.92);
}

['c192','c512'].forEach(id => drawIcon(document.getElementById(id)));

function download(canvasId, filename) {
  const a = document.createElement('a');
  a.href = document.getElementById(canvasId).toDataURL('image/png');
  a.download = filename;
  a.click();
}
</script>
</body>
</html>
