<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B35" />
  <title>MigrantCare Kaohsiung</title>
  <style>
    /* ===== CSS 變數 ===== */
    :root {
      --color-primary:   #FF6B35;
      --color-primary-d: #E55A24;
      --color-navy:      #1B4F72;
      --color-navy-d:    #154260;
      --color-bg:        #F8FAFC;
      --color-surface:   #FFFFFF;
      --color-border:    #E2E8F0;
      --color-text:      #1A202C;
      --color-muted:     #718096;
      --color-success:   #38A169;
      --color-danger:    #E53E3E;

      --radius-card:  16px;
      --radius-btn:   12px;
      --shadow-card:  0 2px 12px rgba(0,0,0,.10);
      --shadow-btn:   0 4px 14px rgba(255,107,53,.35);

      --font-main: -apple-system, "Noto Sans TC", "Noto Sans", "Segoe UI",
                   "Helvetica Neue", Arial, sans-serif;
      --transition: .18s ease;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font-main);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;           /* 各 screen 各自捲動 */
    }

    /* ===== 通用 Screen 容器 ===== */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: opacity var(--transition), transform var(--transition);
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(24px);
    }

    /* ===== 通用按鈕 ===== */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      padding: .85rem 1.6rem;
      background: var(--color-primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-btn);
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: background var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { transform: scale(.96); background: var(--color-primary-d); }

    /* ========================================================
       #lang-screen — 全螢幕語系選擇 Splash
    ======================================================== */
    #lang-screen {
      background: linear-gradient(160deg, var(--color-navy) 0%, #2874A6 55%, #1A5276 100%);
      justify-content: center;
      align-items: center;
      padding: 2rem 1.25rem 2.5rem;
      gap: 0;
    }

    .lang-logo {
      font-size: 3rem;
      margin-bottom: .5rem;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.3));
    }

    .lang-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: .35rem;
      letter-spacing: .03em;
    }

    .lang-subtitle {
      font-size: .85rem;
      color: rgba(255,255,255,.7);
      text-align: center;
      margin-bottom: 2rem;
      data-i18n: "";
    }

    /* 語言卡片格狀排列（2列） */
    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .85rem;
      width: 100%;
      max-width: 420px;
    }

    /* 第 5 張卡片置中 */
    .lang-grid .lang-card:nth-child(5) {
      grid-column: 1 / -1;
      max-width: calc(50% - .43rem);
      justify-self: center;
    }

    .lang-card {
      background: rgba(255,255,255,.12);
      border: 1.5px solid rgba(255,255,255,.22);
      border-radius: var(--radius-card);
      padding: 1.1rem .9rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform var(--transition), background var(--transition), border-color var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .lang-card:hover {
      background: rgba(255,255,255,.2);
      border-color: rgba(255,255,255,.45);
    }
    .lang-card:active {
      transform: scale(.93);
      background: rgba(255,107,53,.4);
      border-color: var(--color-primary);
    }
    .lang-card.selected {
      background: rgba(255,107,53,.35);
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(255,107,53,.45);
    }

    .lang-flag   { font-size: 2.4rem; line-height: 1; }
    .lang-native { font-size: 1rem; font-weight: 700; color: #FFFFFF; text-align: center; }
    .lang-zh     { font-size: .75rem; color: rgba(255,255,255,.65); margin-top: .05rem; }

    /* ========================================================
       #auth-screen — 登入頁
    ======================================================== */
    #auth-screen {
      background: var(--color-bg);
      padding: 1.5rem 1.25rem 2rem;
      gap: 0;
    }

    .auth-header {
      text-align: center;
      padding: 1.5rem 0 1.2rem;
    }
    .auth-header .auth-logo { font-size: 2.6rem; margin-bottom: .4rem; }
    .auth-header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--color-navy);
      margin-bottom: .25rem;
    }
    .auth-header p {
      font-size: .85rem;
      color: var(--color-muted);
    }

    /* 使用者卡片列表 */
    .user-list-label {
      font-size: .8rem;
      font-weight: 600;
      color: var(--color-muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin: 1rem 0 .55rem;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .85rem 1rem;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
      min-height: 64px;
    }
    .user-card:hover  { border-color: var(--color-primary); box-shadow: var(--shadow-card); }
    .user-card:active { transform: scale(.97); }

    .user-card-avatar {
      font-size: 2rem;
      width: 2.6rem;
      text-align: center;
      flex-shrink: 0;
    }
    .user-card-info { flex: 1; min-width: 0; }
    .user-card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-card-identity {
      font-size: .78rem;
      color: var(--color-muted);
      margin-top: .1rem;
    }
    .user-card-arrow {
      font-size: 1.1rem;
      color: var(--color-muted);
      flex-shrink: 0;
    }

    /* 首次無帳號提示 */
    .auth-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--color-muted);
      font-size: .9rem;
    }
    .auth-empty .auth-empty-icon { font-size: 2.8rem; margin-bottom: .6rem; }

    /* 新增使用者按鈕 */
    .btn-add-user {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      width: 100%;
      max-width: 480px;
      margin: .85rem auto 0;
      padding: .9rem 1.4rem;
      background: transparent;
      color: var(--color-primary);
      border: 2px dashed var(--color-primary);
      border-radius: var(--radius-card);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 52px;
      transition: background var(--transition), color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add-user:hover  { background: rgba(255,107,53,.08); }
    .btn-add-user:active { background: rgba(255,107,53,.18); transform: scale(.97); }

    /* ========================================================
       PIN 輸入 Modal
    ======================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--color-surface);
      border-radius: 22px 22px 0 0;
      padding: 1.4rem 1.25rem 2rem;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform .25s cubic-bezier(.32,.72,0,1);
    }
    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-drag { width: 40px; height: 4px; background: var(--color-border); border-radius: 2px; margin: 0 auto .9rem; }

    .pin-modal-user {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.2rem;
    }
    .pin-modal-avatar { font-size: 2rem; }
    .pin-modal-name   { font-size: 1rem; font-weight: 600; color: var(--color-text); }
    .pin-modal-hint   { font-size: .82rem; color: var(--color-muted); margin-top: .05rem; }

    /* PIN 顯示點 */
    .pin-dots {
      display: flex;
      gap: .75rem;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background: transparent;
      transition: background var(--transition), border-color var(--transition);
    }
    .pin-dot.filled {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    /* PIN 錯誤訊息 */
    .pin-error {
      text-align: center;
      font-size: .85rem;
      color: var(--color-danger);
      min-height: 1.2em;
      margin-bottom: .6rem;
    }

    /* 3×4 數字鍵盤 */
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .55rem;
    }
    .pin-key {
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-btn);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--color-text);
      padding: 0;
      height: 56px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition), transform var(--transition);
      user-select: none;
    }
    .pin-key:active { background: var(--color-border); transform: scale(.93); }
    .pin-key.key-del { color: var(--color-muted); font-size: 1.1rem; }
    .pin-key.key-empty { visibility: hidden; pointer-events: none; }

    /* ========================================================
       #register-screen — 註冊頁
    ======================================================== */
    #register-screen {
      background: var(--color-bg);
      padding: 1.5rem 1.25rem 3rem;
      gap: 0;
    }

    .register-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.4rem;
    }
    .btn-back {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: .3rem .5rem;
      border-radius: 8px;
      color: var(--color-navy);
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition);
    }
    .btn-back:active { background: var(--color-border); }
    .register-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-navy);
    }

    /* 表單標籤 */
    .form-section { margin-bottom: 1.35rem; }
    .form-label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--color-muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: .5rem;
    }
    .form-input {
      width: 100%;
      padding: .78rem 1rem;
      font-size: 1rem;
      font-family: var(--font-main);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-btn);
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition);
      min-height: 48px;
    }
    .form-input:focus { border-color: var(--color-primary); }

    /* 身份大按鈕 */
    .identity-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: .55rem;
    }
    .identity-btn {
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .8rem .5rem;
      font-size: .88rem;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      text-align: center;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .25rem;
      transition: border-color var(--transition), background var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .identity-btn .identity-icon { font-size: 1.5rem; }
    .identity-btn:active { transform: scale(.96); }
    .identity-btn.selected {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.08);
      color: var(--color-primary);
    }

    /* 頭像格 */
    .avatar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
    }
    .avatar-btn {
      width: calc((100% - 3.3rem) / 7);
      min-width: 40px;
      aspect-ratio: 1;
      font-size: 1.55rem;
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .avatar-btn.selected {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.1);
      transform: scale(1.12);
    }
    .avatar-btn:active { transform: scale(.92); }

    /* 註冊頁 PIN 鍵盤（嵌入式） */
    .register-pin-dots {
      display: flex;
      gap: .75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .register-pin-error {
      text-align: center;
      font-size: .82rem;
      color: var(--color-danger);
      min-height: 1.2em;
      margin-bottom: .5rem;
    }

    /* 完成按鈕 */
    .btn-done {
      width: 100%;
      padding: .95rem;
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: .5rem;
      border-radius: var(--radius-btn);
      min-height: 52px;
    }

    /* ========================================================
       #main-screen — Sub-Task 3
    ======================================================== */

    /* ---- 主頁骨架 ---- */
    #main-screen {
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    /* ---- Header ---- */
    .main-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface);
      border-bottom: 1.5px solid var(--color-border);
      padding: .6rem 1rem;
      min-height: 52px;
    }
    .main-header-brand {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: -.3px;
    }
    .main-header-right {
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .main-header-user {
      display: flex;
      align-items: center;
      gap: .35rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: .3rem .5rem;
      border-radius: 50px;
      font-size: .9rem;
      font-weight: 600;
      color: var(--color-text);
      -webkit-tap-highlight-color: transparent;
    }
    .main-header-user:active { background: var(--color-border); }
    .main-header-user-avatar { font-size: 1.45rem; line-height: 1; }
    .main-header-lang {
      background: none;
      border: 1.5px solid var(--color-border);
      border-radius: 50px;
      padding: .25rem .6rem;
      font-size: .88rem;
      cursor: pointer;
      color: var(--color-muted);
      -webkit-tap-highlight-color: transparent;
    }
    .main-header-lang:active { border-color: var(--color-primary); color: var(--color-primary); }

    /* ---- 中間可捲動區域 ---- */
    .main-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      /* 底部 Tab Bar 高度 + 緊急按鈕空間 */
      padding-bottom: 80px;
    }

    /* ---- View 切換 ---- */
    .main-view { display: none; }
    .main-view.active { display: block; }

    /* ---- Tab Bar ---- */
    .tab-bar {
      position: sticky;
      bottom: 0;
      z-index: 50;
      display: flex;
      background: var(--color-surface);
      border-top: 1.5px solid var(--color-border);
      height: 60px;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      color: var(--color-muted);
      font-size: .7rem;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: color var(--transition);
    }
    .tab-btn-icon { font-size: 1.35rem; line-height: 1; }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 2px 2px 0 0;
      background: var(--color-primary);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .tab-btn.active { color: var(--color-primary); font-weight: 700; }
    .tab-btn.active::after { opacity: 1; }

    /* ---- Home View ---- */
    .home-section {
      padding: 1rem 1rem 0;
    }

    /* 圓形進度環 */
    .familiarity-ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 1rem .8rem;
    }
    .familiarity-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(
        var(--color-primary) 0deg,
        var(--color-primary) calc(var(--ring-pct, 0) * 3.6deg),
        var(--color-border)  calc(var(--ring-pct, 0) * 3.6deg)
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .familiarity-ring-inner {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: var(--color-surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .familiarity-score-num {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--color-primary);
      line-height: 1;
    }
    .familiarity-score-unit { font-size: .8rem; color: var(--color-muted); margin-top: .1rem; }

    /* 段位徽章 */
    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-top: .75rem;
      background: var(--color-surface);
      border: 1.5px solid var(--color-primary);
      border-radius: 50px;
      padding: .3rem .9rem;
      font-size: .95rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    /* 分項統計 */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
      padding: .5rem 1rem;
    }
    .stat-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .75rem .5rem;
      text-align: center;
    }
    .stat-card-icon { font-size: 1.35rem; margin-bottom: .25rem; }
    .stat-card-label { font-size: .7rem; color: var(--color-muted); margin-bottom: .15rem; }
    .stat-card-value { font-size: .85rem; font-weight: 700; color: var(--color-text); }

    /* 遊戲 Toggle */
    .game-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .8rem 1rem;
      margin: .5rem 1rem;
    }
    .game-toggle-label {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .95rem;
      font-weight: 600;
    }
    /* 滑動開關 */
    .toggle-switch {
      position: relative;
      width: 46px;
      height: 26px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--color-border);
      border-radius: 26px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform var(--transition);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .toggle-switch input:checked + .toggle-slider { background: var(--color-primary); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

    /* 快速入口 */
    .quick-entry-title {
      font-size: .8rem;
      font-weight: 700;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .5rem 1rem .2rem;
    }
    .quick-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
      padding: .25rem 1rem .5rem;
    }
    .quick-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .85rem .4rem;
      text-align: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .quick-card:active { border-color: var(--color-primary); box-shadow: var(--shadow-card); }
    .quick-card-icon { font-size: 1.6rem; margin-bottom: .3rem; }
    .quick-card-label { font-size: .75rem; font-weight: 600; color: var(--color-text); }

    /* 最近位置 */
    .location-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .7rem 1rem;
      margin: .5rem 1rem 1rem;
      font-size: .88rem;
      color: var(--color-muted);
    }

    /* ---- 緊急浮動按鈕群組 ---- */
    .emergency-fab {
      position: fixed;
      right: 1rem;
      bottom: 72px;   /* Tab Bar 60px + 12px margin */
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .fab-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: .7rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .fab-119  { background: var(--color-danger); }
    .fab-1955 { background: var(--color-primary); }
    .fab-btn:active { opacity: .85; transform: scale(.93); }

    /* ── 問診卡 #symptom-view ── */
    .symptom-view-inner {
      padding: .9rem .9rem 6rem;
      max-width: 480px;
      margin: 0 auto;
    }
    /* 步驟進度條 */
    .symptom-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      margin-bottom: 1.1rem;
    }
    .symptom-step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--color-border);
      transition: background .2s;
    }
    .symptom-step-dot.active { background: var(--color-primary); }
    .symptom-step-line {
      flex: 1; max-width: 48px; height: 2px;
      background: var(--color-border);
    }
    /* 步驟標題 */
    .symptom-step-title {
      font-size: .88rem;
      font-weight: 700;
      color: var(--color-muted);
      text-align: center;
      margin-bottom: 1rem;
    }
    /* 部位卡片格線 */
    .body-part-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .65rem;
      margin-bottom: 1.2rem;
    }
    .body-part-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .85rem .5rem;
      border: 2px solid var(--color-border);
      border-radius: 14px;
      background: var(--color-surface);
      cursor: pointer;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .body-part-card:active { transform: scale(.96); }
    .body-part-card.selected {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.08);
    }
    .body-part-card .bp-emoji { font-size: 2.2rem; line-height: 1; }
    .body-part-card .bp-name  { font-size: .85rem; font-weight: 700; color: var(--color-text); text-align: center; }
    .body-part-card.span2 { grid-column: 1 / -1; }
    /* 症狀小標 */
    .symptom-group-label {
      font-size: .75rem;
      font-weight: 700;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: .9rem 0 .5rem;
    }
    /* 症狀卡片格線 */
    .symptom-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .6rem;
      margin-bottom: .4rem;
    }
    .symptom-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      padding: .75rem .5rem;
      border: 2px solid var(--color-border);
      border-radius: 12px;
      background: var(--color-surface);
      cursor: pointer;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .symptom-card:active { transform: scale(.96); }
    .symptom-card.selected {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.08);
    }
    .symptom-card.disabled {
      opacity: .45;
      pointer-events: none;
    }
    .symptom-card .sc-emoji  { font-size: 1.7rem; line-height: 1; }
    .symptom-card .sc-name   { font-size: .8rem; font-weight: 700; color: var(--color-text); text-align: center; }
    .symptom-card .sc-urgent {
      position: absolute;
      top: 4px; right: 6px;
      font-size: .85rem;
      line-height: 1;
    }
    /* 已選計數 */
    .symptom-count-hint {
      text-align: right;
      font-size: .78rem;
      color: var(--color-muted);
      margin-bottom: .7rem;
    }
    /* 步驟底部按鈕列 */
    .symptom-btn-row {
      display: flex;
      gap: .6rem;
      margin-top: .9rem;
    }
    .symptom-btn-row .btn-primary { flex: 1; }
    .btn-outline {
      flex: 1;
      padding: .75rem 1rem;
      border-radius: 14px;
      border: 2px solid var(--color-primary);
      background: transparent;
      color: var(--color-primary);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-outline:active { background: rgba(255,107,53,.1); transform: scale(.97); }
    .btn-outline:disabled { opacity: .45; pointer-events: none; }
    .btn-primary:disabled { opacity: .45; pointer-events: none; }

    /* ── 出示卡 Modal #card-modal ── */
    #card-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    #card-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .card-modal-sheet {
      width: 100%;
      max-height: 92vh;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 1.2rem 1.1rem 2rem;
      overflow-y: auto;
      transform: translateY(40px);
      transition: transform .25s;
    }
    #card-modal.open .card-modal-sheet { transform: translateY(0); }
    .card-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .8rem;
    }
    .card-modal-title {
      font-size: .82rem;
      color: var(--color-muted);
      flex: 1;
    }
    .card-modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--color-muted);
      padding: .2rem .4rem;
    }
    .med-card-block {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: .8rem;
    }
    .med-card-block-label {
      font-size: .7rem;
      color: var(--color-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .45rem;
    }
    .med-card-content {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.5;
    }
    .med-card-divider {
      border: none;
      border-top: 1.5px dashed var(--color-border);
      margin: .7rem 0;
    }
    .med-card-urgent {
      background: #fff0f0;
      border: 1.5px solid #ff4d4d;
      border-radius: 12px;
      padding: .7rem 1rem;
      color: #c0392b;
      font-weight: 700;
      font-size: .92rem;
      text-align: center;
      margin-bottom: .8rem;
    }
    .card-modal-btns {
      display: flex;
      gap: .6rem;
      margin-top: .6rem;
    }
    .card-modal-btns .btn-primary { flex: 1; }
    .card-modal-btns .btn-outline  { flex: 1; }

    /* 語系切換按鈕（auth/register 時右上角） */
    #btn-switch-lang {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: .5rem .9rem;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      z-index: 100;
      display: none;
      transition: background var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    #btn-switch-lang:active { background: var(--color-primary-d); }

    /* ========================================================
       #labor-view — 勞工權益速查（Sub-Task 5）
    ======================================================== */

    /* 外層內距 */
    .labor-view-inner {
      padding: .9rem .9rem 6rem;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 頁面標題列 */
    .labor-view-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--color-navy);
      margin-bottom: .9rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    /* ── 第一層：分類格狀 ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .75rem;
    }

    .category-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 1.1rem .7rem .9rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .category-card:hover  { border-color: var(--color-primary); box-shadow: var(--shadow-card); }
    .category-card:active { transform: scale(.95); }

    .category-card-emoji {
      font-size: 2.2rem;
      line-height: 1;
    }
    .category-card-name {
      font-size: .92rem;
      font-weight: 700;
      color: var(--color-text);
      text-align: center;
    }
    .category-card-count {
      font-size: .72rem;
      color: var(--color-muted);
      background: var(--color-bg);
      border-radius: 20px;
      padding: .15rem .55rem;
      font-weight: 600;
      margin-top: .1rem;
    }

    /* ── 麵包屑 ── */
    .labor-breadcrumb {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      color: var(--color-muted);
      margin-bottom: 1rem;
    }
    .labor-breadcrumb-root {
      cursor: pointer;
      color: var(--color-primary);
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    .labor-breadcrumb-root:hover { text-decoration: underline; }
    .labor-breadcrumb-sep { color: var(--color-border); font-size: .8rem; }
    .labor-breadcrumb-current {
      font-weight: 700;
      color: var(--color-text);
    }

    /* ── 第二層：問題列表手風琴 ── */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .question-item {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: border-color var(--transition);
    }
    .question-item.open { border-color: var(--color-primary); }

    .question-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .85rem 1rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 56px;
    }
    .question-header:active { background: var(--color-bg); }

    .question-header-text {
      flex: 1;
      font-size: .92rem;
      font-weight: 600;
      color: var(--color-text);
      line-height: 1.4;
    }
    .question-read-badge {
      font-size: .7rem;
      color: var(--color-success);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .question-chevron {
      font-size: .85rem;
      color: var(--color-muted);
      flex-shrink: 0;
      transition: transform var(--transition);
      line-height: 1;
    }
    .question-item.open .question-chevron { transform: rotate(90deg); }

    .question-content {
      display: none;
      padding: 0 1rem 1rem;
    }
    .question-item.open .question-content { display: block; }

    /* 合法判斷 badge */
    .legal-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .8rem;
      font-weight: 700;
      border-radius: 20px;
      padding: .25rem .75rem;
      margin-bottom: .75rem;
    }
    .legal-badge.legal   { background: #e6f4ea; color: #2d7a3a; border: 1px solid #a8d5b0; }
    .legal-badge.illegal { background: #fde8e8; color: #c0392b; border: 1px solid #f5a8a8; }
    .legal-badge.check   { background: #fff3e0; color: #b45309; border: 1px solid #fcd5a0; }

    /* 法規說明 */
    .question-answer {
      font-size: .88rem;
      color: var(--color-text);
      line-height: 1.65;
      margin-bottom: .85rem;
    }

    /* 證據收集提醒框 */
    .evidence-box {
      background: #fffde7;
      border: 1.5px solid #f9c74f;
      border-left: 4px solid #f9c74f;
      border-radius: 10px;
      padding: .7rem .85rem;
      margin-bottom: .85rem;
      font-size: .82rem;
      color: #7a5800;
      line-height: 1.55;
    }
    .evidence-box-title {
      font-weight: 700;
      margin-bottom: .3rem;
    }
    .evidence-list {
      margin: 0;
      padding-left: 1.2rem;
    }
    .evidence-list li { margin-bottom: .12rem; }

    /* 行動按鈕群組 */
    .action-btns {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      padding: .6rem 1rem;
      border-radius: var(--radius-btn);
      font-size: .88rem;
      font-weight: 600;
      min-height: 48px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      flex: 1;
      min-width: 120px;
      transition: opacity var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active { opacity: .8; transform: scale(.96); }
    .action-btn-tel {
      background: var(--color-primary);
      color: #fff;
      box-shadow: var(--shadow-btn);
    }
    .action-btn-url {
      background: var(--color-navy);
      color: #fff;
    }

    /* ========================================================
       #map-view — 友善資源地圖（Sub-Task 6）
    ======================================================== */

    #map-view {
      display: none;
      flex-direction: column;
      min-height: calc(100vh - 52px - 60px); /* viewport - header - tabbar */
    }
    #map-view.active {
      display: flex;
    }

    /* Leaflet 地圖容器 */
    #leaflet-map {
      flex: 0 0 55vh;
      min-height: 200px;
      width: 100%;
      background: #e8f0e8;
      position: relative;
      z-index: 1;
    }

    /* 控制列 */
    .map-controls {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: .45rem;
      padding: .55rem .75rem .4rem;
      background: var(--color-surface);
      border-bottom: 1.5px solid var(--color-border);
    }
    .map-locate-btn {
      width: 100%;
      padding: .65rem;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      transition: background var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .map-locate-btn:active { transform: scale(.97); background: var(--color-primary-d); }

    /* 類型篩選 Tab */
    .map-filter-tabs {
      display: flex;
      gap: .35rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .map-filter-tabs::-webkit-scrollbar { display: none; }
    .map-filter-tab {
      flex-shrink: 0;
      padding: .38rem .75rem;
      border-radius: 50px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-muted);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color var(--transition), background var(--transition), color var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .map-filter-tab.active {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.1);
      color: var(--color-primary);
    }

    /* 機構列表（下半部可滑動） */
    .map-location-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: .55rem .75rem 80px;
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    /* 機構卡片 */
    .location-card {
      display: flex;
      align-items: stretch;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .location-card:active { box-shadow: var(--shadow-card); border-color: var(--color-primary); }
    .location-card.nearby {
      border-color: var(--color-primary);
      background: rgba(255,107,53,.04);
    }
    .location-card-stripe {
      width: 5px;
      flex-shrink: 0;
    }
    .stripe-medical  { background: #3b82f6; }
    .stripe-legal    { background: #22c55e; }
    .stripe-newcomer { background: #f97316; }

    .location-card-body {
      flex: 1;
      padding: .65rem .75rem;
      min-width: 0;
    }
    .location-card-header {
      display: flex;
      align-items: center;
      gap: .4rem;
      margin-bottom: .2rem;
    }
    .location-card-name {
      font-size: .9rem;
      font-weight: 700;
      color: var(--color-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .location-card-nearby-badge {
      flex-shrink: 0;
      font-size: .68rem;
      font-weight: 700;
      background: var(--color-primary);
      color: #fff;
      border-radius: 50px;
      padding: .1rem .45rem;
    }
    .location-card-address {
      font-size: .76rem;
      color: var(--color-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: .2rem;
    }
    .location-card-phone {
      font-size: .78rem;
      color: var(--color-navy);
      font-weight: 600;
    }
    .map-nearby-label {
      font-size: .75rem;
      font-weight: 700;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .3rem .1rem .1rem;
    }

    /* ========================================================
       Sub-Task 7 — 地標遊戲 Toast + Modal
    ======================================================== */

    /* ---- #game-toast 底部通知條 ---- */
    .game-toast {
      position: fixed;
      bottom: 68px;        /* Tab Bar(60) + 8px margin */
      left: .75rem;
      right: .75rem;
      z-index: 300;
      background: #FF8C00;
      color: #fff;
      border-radius: 14px;
      padding: .75rem 1rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.28);
      transform: translateY(120%);
      transition: transform .32s cubic-bezier(.32,.72,0,1);
    }
    .game-toast.visible {
      transform: translateY(0);
    }
    .game-toast.hidden { display: none; }
    .game-toast-text {
      flex: 1;
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .game-toast-start {
      background: #fff;
      color: #FF8C00;
      border: none;
      border-radius: 8px;
      padding: .45rem .9rem;
      font-size: .9rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .game-toast-start:active { opacity: .85; transform: scale(.95); }
    .game-toast-dismiss {
      background: transparent;
      color: rgba(255,255,255,.8);
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: .1rem .3rem;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }

    /* ---- #game-modal 全螢幕遊戲 Modal ---- */
    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      transition: opacity .22s ease, transform .22s ease;
    }
    .game-modal.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
    }
    .game-modal-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    /* 遊戲 Header */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 0 .5rem;
      border-bottom: 1.5px solid var(--color-border);
      margin-bottom: 1rem;
    }
    .game-header-info {
      flex: 1;
      min-width: 0;
    }
    .game-landmark-name {
      font-size: .95rem;
      font-weight: 800;
      color: var(--color-navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-distance {
      font-size: .75rem;
      color: var(--color-muted);
      margin-top: .1rem;
    }
    .btn-close-game {
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-muted);
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition), border-color var(--transition);
    }
    .btn-close-game:active { background: var(--color-border); }

    /* 遊戲內容區 */
    #game-content {
      flex: 1;
    }

    /* 遊戲 A — 閃卡配對 */
    .game-a-emoji {
      font-size: 4.5rem;
      text-align: center;
      margin: 1rem 0 .75rem;
      line-height: 1;
    }
    .game-a-question {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-navy);
      text-align: center;
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }
    .game-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .65rem;
    }
    .game-option-btn {
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .85rem .6rem;
      font-size: .92rem;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      text-align: center;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .game-option-btn:active { transform: scale(.96); }
    .game-option-btn.correct {
      border-color: var(--color-success);
      background: #e6f4ea;
      color: var(--color-success);
    }
    .game-option-btn.wrong {
      border-color: var(--color-danger);
      background: #fde8e8;
      color: var(--color-danger);
    }
    .game-option-btn:disabled { cursor: default; }

    /* 遊戲 B — 緊急排序 */
    .game-b-instruct {
      font-size: .85rem;
      color: var(--color-muted);
      text-align: center;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .game-b-question {
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-navy);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .game-sort-list {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      margin-bottom: 1rem;
    }
    .game-sort-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .7rem .9rem;
      min-height: 52px;
    }
    .game-sort-rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      font-size: .8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .game-sort-emoji { font-size: 1.5rem; flex-shrink: 0; }
    .game-sort-label { flex: 1; font-size: .9rem; font-weight: 600; }
    .game-sort-btns {
      display: flex;
      flex-direction: column;
      gap: .2rem;
      flex-shrink: 0;
    }
    .game-sort-btn {
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: 6px;
      width: 30px;
      height: 26px;
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition);
    }
    .game-sort-btn:active { background: var(--color-border); transform: scale(.92); }
    .game-sort-btn:disabled { opacity: .3; pointer-events: none; }
    .btn-confirm-sort {
      width: 100%;
      padding: .9rem;
      background: var(--color-navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--transition), transform var(--transition);
    }
    .btn-confirm-sort:active { transform: scale(.97); background: var(--color-navy-d); }

    /* 遊戲 C — 情境填空 */
    .game-c-instruct {
      font-size: .85rem;
      color: var(--color-muted);
      text-align: center;
      margin-bottom: 1rem;
    }
    .game-c-sentence {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-navy);
      text-align: center;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 1rem;
      margin-bottom: 1.2rem;
      line-height: 1.7;
    }
    .game-c-sentence .blank {
      display: inline-block;
      min-width: 80px;
      border-bottom: 2.5px solid var(--color-primary);
      color: var(--color-primary);
      font-weight: 800;
    }
    .game-c-options {
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }
    .game-c-option-btn {
      background: var(--color-surface);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .85rem 1rem;
      font-size: .95rem;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      text-align: left;
      min-height: 52px;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .game-c-option-btn:active { transform: scale(.97); }
    .game-c-option-btn.correct {
      border-color: var(--color-success);
      background: #e6f4ea;
      color: var(--color-success);
    }
    .game-c-option-btn.wrong {
      border-color: var(--color-danger);
      background: #fde8e8;
      color: var(--color-danger);
    }
    .game-c-option-btn:disabled { cursor: default; }

    /* 遊戲結果區 */
    #game-result {
      margin-top: 1.2rem;
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    #game-result.hidden { display: none; }
    .game-result-banner {
      padding: .85rem 1rem;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .game-result-banner.correct-banner {
      background: #e6f4ea;
      color: var(--color-success);
    }
    .game-result-banner.wrong-banner {
      background: #fde8e8;
      color: var(--color-danger);
    }
    .game-result-explain {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: .85rem 1rem;
      margin-top: .65rem;
      font-size: .88rem;
      color: var(--color-text);
      line-height: 1.65;
    }
    .game-result-score {
      text-align: center;
      font-size: .82rem;
      color: var(--color-muted);
      margin-top: .55rem;
    }
    .game-result-close-hint {
      text-align: center;
      font-size: .78rem;
      color: var(--color-muted);
      margin-top: .45rem;
      font-style: italic;
    }

    /* ========================================================
       Sub-Task 8 — 成就機制 & 排名系統
    ======================================================== */

    /* ---- 成就格子區 ---- */
    .section-title {
      font-size: .8rem;
      font-weight: 700;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .6rem 1rem .2rem;
    }
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .45rem;
      padding: .25rem 1rem .75rem;
    }
    .ach-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .2rem;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      padding: .6rem .2rem;
      cursor: default;
      position: relative;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .ach-cell.unlocked {
      border-color: #f9c74f;
      background: linear-gradient(135deg, #fffde7 0%, #fff8e1 100%);
      cursor: pointer;
    }
    .ach-cell.unlocked:active { transform: scale(.95); }
    .ach-cell-emoji {
      font-size: 1.55rem;
      line-height: 1;
    }
    .ach-cell.locked .ach-cell-emoji {
      filter: grayscale(1) opacity(.35);
    }
    .ach-cell-name {
      font-size: .6rem;
      font-weight: 600;
      text-align: center;
      color: var(--color-text);
      line-height: 1.2;
    }
    .ach-cell.locked .ach-cell-name {
      color: var(--color-muted);
    }

    /* 解鎖時間 tooltip */
    .ach-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(27,79,114,.9);
      color: #fff;
      font-size: .7rem;
      padding: .3rem .55rem;
      border-radius: 8px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 500;
      opacity: 0;
      transition: opacity .15s;
    }
    .ach-cell.unlocked:hover .ach-tooltip,
    .ach-cell.unlocked:focus .ach-tooltip { opacity: 1; }

    /* ---- 成就慶祝 Modal ---- */
    .achievement-modal {
      position: fixed;
      inset: 0;
      z-index: 600;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .achievement-modal.hidden { display: none; }

    .achievement-celebration {
      background: var(--color-surface);
      border-radius: 22px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      animation: achBounceIn .45s cubic-bezier(.22,.68,0,1.3) both;
      position: relative;
    }
    @keyframes achBounceIn {
      0%   { transform: scale(.4) translateY(60px); opacity: 0; }
      70%  { transform: scale(1.06) translateY(-6px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .ach-stars {
      font-size: 1.4rem;
      letter-spacing: .15em;
      margin-bottom: .6rem;
      animation: achSparkle 1s ease-in-out infinite alternate;
    }
    @keyframes achSparkle {
      0%   { transform: scale(1) rotate(-4deg); }
      100% { transform: scale(1.15) rotate(4deg); }
    }
    .ach-emoji {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: .6rem;
      animation: achEmojiPop .6s cubic-bezier(.22,.68,0,1.4) .1s both;
    }
    @keyframes achEmojiPop {
      0%   { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .ach-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--color-navy);
      margin-bottom: .35rem;
    }
    .ach-time {
      font-size: .78rem;
      color: var(--color-muted);
      margin-bottom: 1.2rem;
    }
    .achievement-celebration button {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition);
    }
    .achievement-celebration button:active { background: var(--color-primary-d); transform: scale(.97); }

    /* ---- 段位升段 Toast ---- */
    .rankup-toast {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 550;
      background: linear-gradient(90deg, #f9c74f 0%, #f4a261 100%);
      color: #7a4a00;
      padding: .7rem 1.2rem;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: .02em;
      transform: translateY(-100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .rankup-toast.visible { transform: translateY(0); }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLEg=" crossorigin=""></script>

  <script>
    /* ═══════════════════════════════════════════════════════════
       工具函式
    ═══════════════════════════════════════════════════════════ */

    /** 讀取目前語系，預設 'zh' */
    function getCurrentLang() {
      return localStorage.getItem('migrant_lang') || 'zh';
    }

    /** 取得翻譯字串 */
    function t(key) {
      const lang = getCurrentLang();
      const dict = LANG_DATA[lang] || LANG_DATA['zh'];
      return dict[key] !== undefined ? dict[key] : key;
    }

    /**
     * applyLang()
     * 讀取 localStorage 語系，將所有 [data-i18n] 元素的文字替換為對應語系的字串。
     */
    function applyLang() {
      const lang   = getCurrentLang();
      const dict   = LANG_DATA[lang] || LANG_DATA['zh'];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key && dict[key] !== undefined) el.textContent = dict[key];
      });

      const langMap = { zh: 'zh-TW', en: 'en', id: 'id', vi: 'vi', th: 'th' };
      document.documentElement.lang = langMap[lang] || 'zh-TW';

      document.querySelectorAll('.lang-card').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.lang === lang);
      });
    }

    /**
     * setLanguage(code)
     */
    function setLanguage(code) {
      if (!LANG_DATA[code]) return;

      const card = document.querySelector(`.lang-card[data-lang="${code}"]`);
      if (card) {
        card.classList.add('selected');
        card.style.transform = 'scale(0.9)';
        setTimeout(() => { card.style.transform = ''; }, 180);
      }

      localStorage.setItem('migrant_lang', code);
      applyLang();

      setTimeout(() => {
        showScreen('auth-screen');
        renderUserList();
      }, 220);
    }

    /**
     * showScreen(id)
     */
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => {
        s.classList.toggle('hidden', s.id !== screenId);
      });
      // auth/register 時顯示語言切換按鈕，main-screen 與 lang-screen 不顯示
      const switchBtn = document.getElementById('btn-switch-lang');
      if (switchBtn) {
        switchBtn.style.display =
          (screenId !== 'lang-screen' && screenId !== 'main-screen') ? 'flex' : 'none';
      }
      // 主頁面時顯示緊急浮動按鈕
      const fab = document.getElementById('emergency-fab');
      if (fab) fab.style.display = (screenId === 'main-screen') ? 'flex' : 'none';
    }

    /* ═══════════════════════════════════════════════════════════
       localStorage helpers
    ═══════════════════════════════════════════════════════════ */

    const USERS_KEY = 'migrant_users';

    /** 讀取整包 store */
    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY)) || { users: [], currentUserId: null };
      } catch {
        return { users: [], currentUserId: null };
      }
    }

    /** 儲存整包 store */
    function saveStore(store) {
      localStorage.setItem(USERS_KEY, JSON.stringify(store));
    }

    /* ═══════════════════════════════════════════════════════════
       使用者 API
    ═══════════════════════════════════════════════════════════ */

    /**
     * createUser({ nickname, pin, avatar, identity, lang })
     * 建立完整使用者物件，存入 localStorage，回傳新使用者。
     */
    function createUser({ nickname, pin, avatar, identity, lang }) {
      const store = loadStore();
      const user = {
        id: 'uid_' + Date.now(),
        nickname,
        pin,
        avatar,
        identity,
        lang: lang || getCurrentLang(),
        createdAt: new Date().toISOString().slice(0, 10),
        lastLocation: null,
        laborProgress: {},
        symptomHistory: [],
        gameEnabled: true,
        gameStats: {
          totalPlayed: 0,
          totalCorrect: 0,
          landmarksVisited: [],
          achievements: []
        },
        familiarityScore: 0
      };
      store.users.push(user);
      saveStore(store);
      return user;
    }

    /**
     * loginUser(userId, pin)
     * 驗證 PIN，設定 currentUserId，跳至主頁。
     * 回傳 true（成功）或 false（失敗）。
     */
    function loginUser(userId, pin) {
      const store = loadStore();
      const user = store.users.find(u => u.id === userId);
      if (!user || user.pin !== pin) return false;

      store.currentUserId = userId;
      saveStore(store);

      // 同步語系
      localStorage.setItem('migrant_lang', user.lang || getCurrentLang());
      applyLang();

      // 渲染主頁面並切換
      renderHomePage();
      showScreen('main-screen');

      // Sub-Task 7：若遊戲開啟，自動啟動 GPS 掃描
      if (user.gameEnabled !== false) {
        startGpsWatch();
      }

      return true;
    }

    /**
     * getCurrentUser()
     * 回傳目前登入的使用者物件，或 null。
     */
    function getCurrentUser() {
      const store = loadStore();
      if (!store.currentUserId) return null;
      return store.users.find(u => u.id === store.currentUserId) || null;
    }

    /**
     * saveUserData(userId, updates)
     * 以 updates 淺層合併更新指定使用者資料，並儲存。
     */
    function saveUserData(userId, updates) {
      const store = loadStore();
      const idx = store.users.findIndex(u => u.id === userId);
      if (idx === -1) return;
      store.users[idx] = Object.assign({}, store.users[idx], updates);
      saveStore(store);
    }

    /* ═══════════════════════════════════════════════════════════
       Sub-Task 6 — 地圖模組全局狀態（須在 switchTab 前宣告）
    ═══════════════════════════════════════════════════════════ */

    const _mapState = {
      initialized: false,
      map: null,
      markers: [],      // Leaflet Marker 物件陣列（同步 LOCATIONS 順序）
      circles: [],      // 200m 圓圈
      userMarker: null, // 使用者位置 marker
      currentFilter: 'all'
    };

    const MAP_TYPE_CONFIG = {
      medical:  { color: '#3b82f6', label: '醫' },
      legal:    { color: '#22c55e', label: '法' },
      newcomer: { color: '#f97316', label: '新' }
    };

    /* ═══════════════════════════════════════════════════════════
       Sub-Task 3 — 主頁面邏輯
    ═══════════════════════════════════════════════════════════ */

    /**
     * switchTab(tabName)
     * 切換 main-view 顯示與 Tab Bar 的 active 狀態。
     * tabName: 'home' | 'symptom' | 'labor' | 'map'
     */
    function switchTab(tabName) {
      // 切換 view
      document.querySelectorAll('.main-view').forEach(v => {
        v.classList.toggle('active', v.id === tabName + '-view');
      });
      // 切換 tab active 狀態
      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isActive = btn.id === 'tab-' + tabName;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', String(isActive));
      });
      // Sub-Task 4：切換到問診卡 Tab 時初始化
      if (tabName === 'symptom') {
        initSymptomView();
      }
      // Sub-Task 5：切換到權益速查 Tab 時初始化
      if (tabName === 'labor') {
        renderLaborCategories();
      }
      // Sub-Task 6：切換到資源地圖 Tab 時初始化或修正尺寸
      if (tabName === 'map') {
        if (!_mapState.initialized) {
          // 下一 frame 確保 #map-view 已 display:flex
          requestAnimationFrame(() => initMap());
        } else if (_mapState.map) {
          requestAnimationFrame(() => _mapState.map.invalidateSize());
        }
      }
    }

    /**
     * calcFamiliarityScore(user)
     * 計算 0-100 分：勞工50% + 問診20% + 地標30%
     */
    function calcFamiliarityScore(user) {
      const laborCount    = Object.keys(user.laborProgress || {}).length;    // 最多 24 題
      const symptomCount  = (user.symptomHistory || []).length;               // 最多 10 次算滿分
      const landmarkCount = (user.gameStats?.landmarksVisited || []).length;  // 最多 10 個算滿分

      const laborScore    = Math.min(laborCount / 24, 1) * 50;
      const symptomScore  = Math.min(symptomCount / 10, 1) * 20;
      const landmarkScore = Math.min(landmarkCount / 10, 1) * 30;

      return Math.round(laborScore + symptomScore + landmarkScore);
    }

    /**
     * getRank(score)
     * 依分數回傳段位物件 { emoji, key }
     */
    function getRank(score) {
      if (score >= 80) return { emoji: '🏆', key: 'rankExpert'  };
      if (score >= 60) return { emoji: '⭐', key: 'rankSkilled' };
      if (score >= 40) return { emoji: '🌳', key: 'rankSteady'  };
      if (score >= 20) return { emoji: '🌿', key: 'rankGrowing' };
      return                 { emoji: '🌱', key: 'rankSprout'  };
    }

    /**
     * renderFamiliarityChart()
     * 更新圓形進度環、分數數字、段位徽章、分項統計。
     */
    function renderFamiliarityChart() {
      const user = getCurrentUser();
      if (!user) return;

      const score = calcFamiliarityScore(user);
      const rank  = getRank(score);

      // 圓形進度環（CSS custom property）
      const ring = document.getElementById('familiarity-ring');
      if (ring) ring.style.setProperty('--ring-pct', score);

      // 分數數字
      const scoreEl = document.getElementById('familiarity-score');
      if (scoreEl) scoreEl.textContent = score;

      // 段位
      const emojiEl = document.getElementById('rank-emoji');
      const nameEl  = document.getElementById('rank-name');
      if (emojiEl) emojiEl.textContent = rank.emoji;
      if (nameEl)  {
        nameEl.textContent = t(rank.key);
        nameEl.setAttribute('data-i18n', rank.key);
      }

      // 分項統計
      const laborCount    = Object.keys(user.laborProgress || {}).length;
      const symptomCount  = (user.symptomHistory || []).length;
      const landmarkCount = (user.gameStats?.landmarksVisited || []).length;

      const statLabor    = document.getElementById('stat-labor');
      const statSymptom  = document.getElementById('stat-symptom');
      const statLandmark = document.getElementById('stat-landmark');
      if (statLabor)    statLabor.textContent    = laborCount + '/24';
      if (statSymptom)  statSymptom.textContent  = symptomCount;
      if (statLandmark) statLandmark.textContent = landmarkCount;

      // 最近位置
      const locEl = document.getElementById('home-location');
      if (locEl) {
        if (user.lastLocation && user.lastLocation.timestamp) {
          const d = new Date(user.lastLocation.timestamp);
          locEl.textContent = d.toLocaleString() + (user.lastLocation.area ? '  ' + user.lastLocation.area : '');
          locEl.removeAttribute('data-i18n');
        } else {
          locEl.textContent = t('homeNoLocation');
          locEl.setAttribute('data-i18n', 'homeNoLocation');
        }
      }
    }

    /**
     * renderHomePage()
     * 更新 Header 使用者資訊 + 呼叫 renderFamiliarityChart + 設定 Toggle 初始狀態。
     */
    function renderHomePage() {
      const user = getCurrentUser();
      if (!user) return;

      // Header 使用者資訊
      const avatarEl = document.getElementById('header-avatar');
      const nickEl   = document.getElementById('header-nickname');
      if (avatarEl) avatarEl.textContent = user.avatar;
      if (nickEl)   nickEl.textContent   = user.nickname;

      // 圓形進度環 & 統計
      renderFamiliarityChart();

      const toggleEl = document.getElementById('game-toggle-input');
      if (toggleEl) {
        toggleEl.checked = user.gameEnabled !== false;   // 預設 true
        toggleEl.onchange = function() {
          const u = getCurrentUser();
          if (!u) return;
          saveUserData(u.id, { gameEnabled: this.checked });
          if (this.checked) {
            startGpsWatch();
          } else {
            stopGpsWatch();
          }
        };
      }

    /**
     * renderUserList()
     * 依 localStorage 使用者列表，重新渲染 #user-list 卡片。
     */
    function renderUserList() {
      const store = loadStore();
      const list  = document.getElementById('user-list');
      if (!list) return;

      list.innerHTML = '';

      if (store.users.length === 0) {
        // 無帳號 → 顯示歡迎提示
        list.innerHTML = `
          <div class="auth-empty">
            <div class="auth-empty-icon">👋</div>
            <p>${t('authWelcome')}！</p>
            <p style="margin-top:.3rem;font-size:.82rem;">請先建立帳號</p>
          </div>`;
        return;
      }

      const identityIcon = { worker: '🏗️', newcomer: '🏠', other: '👤' };
      const identityLabel = { worker: t('identityWorker'), newcomer: t('identityNewcomer'), other: t('identityOther') };

      store.users.forEach(user => {
        const card = document.createElement('button');
        card.className = 'user-card';
        card.dataset.uid = user.id;
        card.setAttribute('aria-label', user.nickname);
        card.innerHTML = `
          <span class="user-card-avatar">${user.avatar}</span>
          <span class="user-card-info">
            <span class="user-card-name">${user.nickname}</span>

    /* ═══════════════════════════════════════════════════════════
       PIN Modal（登入用）
    ═══════════════════════════════════════════════════════════ */

    let _pinModalUserId = null;
    let _pinModalValue  = '';

    function openPinModal(userId) {
      const store = loadStore();
      const user  = store.users.find(u => u.id === userId);
      if (!user) return;

      _pinModalUserId = userId;
      _pinModalValue  = '';

      document.getElementById('pin-modal-avatar').textContent = user.avatar;
      document.getElementById('pin-modal-name').textContent   = user.nickname;
      document.getElementById('pin-error').textContent        = '';
      _updatePinDots('pin-dots', 0);

      document.getElementById('pin-modal').classList.add('open');
    }

    function closePinModal() {
      _pinModalUserId = null;
      _pinModalValue  = '';
      document.getElementById('pin-modal').classList.remove('open');
    }

    function _updatePinDots(dotContainerId, filledCount) {
      document.querySelectorAll(`#${dotContainerId} .pin-dot`).forEach((dot, i) => {
        dot.classList.toggle('filled', i < filledCount);
      });
    }

    // 登入 Modal 鍵盤事件
    document.getElementById('pin-keypad').addEventListener('click', e => {
      const btn = e.target.closest('.pin-key');
      if (!btn) return;
      if (btn.classList.contains('key-del')) {
        _pinModalValue = _pinModalValue.slice(0, -1);
        _updatePinDots('pin-dots', _pinModalValue.length);
        document.getElementById('pin-error').textContent = '';
        return;
      }
      if (btn.dataset.val === undefined) return;
      if (_pinModalValue.length >= 4) return;

      _pinModalValue += btn.dataset.val;
      _updatePinDots('pin-dots', _pinModalValue.length);

      if (_pinModalValue.length === 4) {
        // 自動驗證
        setTimeout(() => {
          const ok = loginUser(_pinModalUserId, _pinModalValue);
          if (ok) {
            closePinModal();
          } else {
            document.getElementById('pin-error').textContent = t('msgLoginFail');
            // 震動回饋
            _pinModalValue = '';
            _updatePinDots('pin-dots', 0);
          }
        }, 150);
      }
    });

    // 點遮罩關閉 Modal
    document.getElementById('pin-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closePinModal();
    });

      btn.classList.add('selected');
      _selectedAvatar = btn.dataset.avatar;
    });

    // 註冊頁 PIN 鍵盤
    document.getElementById('reg-pin-keypad').addEventListener('click', e => {
      const btn = e.target.closest('.pin-key');
      if (!btn) return;
      if (btn.classList.contains('key-del')) {
        _regPin = _regPin.slice(0, -1);
        _updatePinDots('reg-pin-dots', _regPin.length);
        return;
      }
      if (btn.dataset.val === undefined) return;
      if (_regPin.length >= 4) return;
      _regPin += btn.dataset.val;
      _updatePinDots('reg-pin-dots', _regPin.length);

    // 完成註冊
    document.getElementById('btn-reg-done').addEventListener('click', () => {
      const nickname = document.getElementById('reg-nickname').value.trim();
      const errEl    = document.getElementById('reg-pin-error');

      if (nickname.length < 2 || nickname.length > 20) {
        errEl.textContent = t('msgNicknameRequired');

        return;

      if (_regPin.length !== 4) {

      if (!_selectedAvatar) {
        errEl.textContent = t('labelAvatar') + ' ?';
        return;

        nickname,
        pin: _regPin,
        avatar: _selectedAvatar,
        identity: _selectedIdentity,
        lang: getCurrentLang()
      });

    /* ═══════════════════════════════════════════════════════════
       Sub-Task 4 — 問診卡模組
