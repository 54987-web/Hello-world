    /**
     * 問診卡模組狀態（模組層級）
     * _sx.step        : 1 | 2（目前步驟）
     * _sx.partId      : 已選部位 id
     * _sx.selectedIds : Set<string>，已選症狀 id
     */
    const _sx = { step: 1, partId: null, selectedIds: new Set() };

    /** _symptomProgressDots(step) — 渲染步驟圓點 HTML */
    function _symptomProgressDots(step) {
      const dots = [1, 2, 3].map((n, i) => {
        const active = n <= step ? ' active' : '';
        const dot = `<span class="symptom-step-dot${active}"></span>`;
        return i < 2 ? dot + '<span class="symptom-step-line"></span>' : dot;
      }).join('');
      return `<div class="symptom-steps">${dots}</div>`;
    }

    /**
     * renderSymptomStep1()
     * 渲染 #symptom-inner：步驟 1 — 選擇身體部位
     */
    function renderSymptomStep1() {
      _sx.step = 1;
      const lang = getCurrentLang();
      const inner = document.getElementById('symptom-inner');
      if (!inner) return;

      // 部位卡片 HTML（最後一個「全身」跨兩欄）
      const cardsHtml = BODY_PARTS.map((bp) => {
        const isSelected = bp.id === _sx.partId;
        const span2 = bp.id === 'whole' ? ' span2' : '';
        const sel   = isSelected ? ' selected' : '';
        return `<button class="body-part-card${span2}${sel}" data-part="${bp.id}" aria-pressed="${isSelected}">
          <span class="bp-emoji">${bp.emoji}</span>
          <span class="bp-name">${bp.names[lang] || bp.names.zh}</span>
        </button>`;
      }).join('');

      inner.innerHTML = `
        ${_symptomProgressDots(1)}
        <p class="symptom-step-title">${t('symptomStep1Title')}</p>
        <div class="body-part-grid">${cardsHtml}</div>
        <div class="symptom-btn-row">
          <button class="btn-primary" id="sx-btn-next1"
            ${_sx.partId ? '' : 'disabled'}
            onclick="renderSymptomStep2()">
            ${t('symptomBtnNext')}
          </button>
        </div>`;

      // 點選部位卡片
      inner.querySelectorAll('.body-part-card').forEach(btn => {
        btn.addEventListener('click', function() {
          _sx.partId = this.dataset.part;
          // 重繪（更新 selected 狀態 + 啟用下一步）
          renderSymptomStep1();
        });
      });
    }

    /**
     * renderSymptomStep2()
     * 渲染 #symptom-inner：步驟 2 — 選擇症狀（最多 3 項）
     */
    function renderSymptomStep2() {
      _sx.step = 2;
      _sx.selectedIds = new Set(); // 切換到步驟2時重置
      const lang = getCurrentLang();
      const inner = document.getElementById('symptom-inner');
      if (!inner) return;

      function buildGrid(group) {
        return SYMPTOMS.filter(s => s.group === group).map(s => {
          const isSelected = _sx.selectedIds.has(s.id);
          const sel   = isSelected ? ' selected' : '';
          const isDisabled = !isSelected && _sx.selectedIds.size >= 3;
          const dis   = isDisabled ? ' disabled' : '';
          const urgent = s.urgency === 'high' ? '<span class="sc-urgent">🔴</span>' : '';
          return `<button class="symptom-card${sel}${dis}" data-symptom="${s.id}" aria-pressed="${isSelected}">
            ${urgent}
            <span class="sc-emoji">${s.emoji}</span>
            <span class="sc-name">${s.names[lang] || s.names.zh}</span>
          </button>`;
        }).join('');
      }

      function render() {
        const count = _sx.selectedIds.size;
        const countText = t('symptomSelectedCount').replace('{n}', count);
        inner.innerHTML = `
          ${_symptomProgressDots(2)}
          <p class="symptom-step-title">${t('symptomStep2Title')}</p>
          <p class="symptom-count-hint">${countText}</p>
          <p class="symptom-group-label">${t('symptomGroupGeneral')}</p>
          <div class="symptom-cards-grid" id="sg-general">${buildGrid('general')}</div>
          <p class="symptom-group-label">${t('symptomGroupPain')}</p>
          <div class="symptom-cards-grid" id="sg-pain">${buildGrid('pain')}</div>
          <div class="symptom-btn-row">
            <button class="btn-outline" onclick="renderSymptomStep1()">${t('symptomBtnBack')}</button>
            <button class="btn-primary" id="sx-btn-generate"
              ${count > 0 ? '' : 'disabled'}
              onclick="generateMedCard()">
              ${t('symptomBtnGenerate')}
            </button>
          </div>`;

        // 點選症狀卡片
        inner.querySelectorAll('.symptom-card').forEach(btn => {
          btn.addEventListener('click', function() {
            const id = this.dataset.symptom;
            if (_sx.selectedIds.has(id)) {
              _sx.selectedIds.delete(id);
            } else if (_sx.selectedIds.size < 3) {
              _sx.selectedIds.add(id);
            }
            render();   // 重繪
          });
        });
      }

      render();
    }

    /**
     * generateMedCard()
     * 生成雙語出示卡並顯示 #card-modal
     * 同時寫入 symptomHistory + 更新 familiarityScore
     */
    function generateMedCard() {
      const lang  = getCurrentLang();
      const part  = BODY_PARTS.find(p => p.id === _sx.partId);
      const syms  = SYMPTOMS.filter(s => _sx.selectedIds.has(s.id));
      if (!part || syms.length === 0) return;

      const hasUrgent = syms.some(s => s.urgency === 'high');

      // ── 母語文字 ──
      const nativePart  = part.names[lang] || part.names.zh;
      const nativeSyms  = syms.map(s => s.names[lang] || s.names.zh).join('、');
      const nativeText  = `${nativePart}：${nativeSyms}`;

      // ── 中文文字（永遠用 zh）──
      const zhPart = part.names.zh;
      const zhSyms = syms.map(s => s.names.zh).join('、');
      const zhText = `${zhPart}：${zhSyms}`;

      // 複製用純文字
      const copyText = [
        t('symptomCardTitle'),
        '',
        `[${lang !== 'zh' ? (part.names[lang] || part.names.zh) : ''}] ${nativeText}`,
        '',
        `[中文] 我的症狀：${zhText}`
      ].join('\n');

      // ── 填入 modal ──
      document.getElementById('card-modal-title-text').textContent = t('symptomCardTitle');

      const urgentEl = document.getElementById('card-urgent');
      urgentEl.style.display = hasUrgent ? '' : 'none';
      if (hasUrgent) urgentEl.textContent = t('symptomUrgentAlert');

      document.getElementById('card-native-label').textContent   = t('symptomCardNative');
      document.getElementById('card-native-content').textContent = nativeText;
      document.getElementById('card-zh-label').textContent       = t('symptomCardZh');
      document.getElementById('card-zh-content').textContent     = `我的症狀：${zhText}`;

      const copyBtn  = document.getElementById('card-btn-copy');
      const resetBtn = document.getElementById('card-btn-reset');
      copyBtn.textContent  = t('symptomBtnCopy');
      resetBtn.textContent = t('symptomBtnReset');

      copyBtn.onclick = function() {
        navigator.clipboard.writeText(copyText).then(() => {
          const orig = this.textContent;
          this.textContent = t('symptomCopied');
          setTimeout(() => { this.textContent = orig; }, 1800);
        }).catch(() => {
          // fallback：選取文字
          const tmp = document.createElement('textarea');
          tmp.value = copyText;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand('copy');
          document.body.removeChild(tmp);
          const orig = this.textContent;
          this.textContent = t('symptomCopied');
          setTimeout(() => { this.textContent = orig; }, 1800);
        });
      };

      resetBtn.onclick = function() {
        closeCardModal();
        _sx.partId = null;
        _sx.selectedIds = new Set();
        renderSymptomStep1();
      };

      // ── 開啟 modal ──
      document.getElementById('card-modal').classList.add('open');

      // ── 寫入 symptomHistory + 更新 familiarityScore ──
      const user = getCurrentUser();
      if (user) {
        const history = user.symptomHistory || [];
        history.push({
          ts: Date.now(),
          partId: part.id,
          partZh: part.names.zh,
          symptoms: syms.map(s => ({ id: s.id, zh: s.names.zh })),
          urgent: hasUrgent
        });
        const oldScore = user.familiarityScore || 0;
        const newScore = calcFamiliarityScore(
          Object.assign({}, user, { symptomHistory: history })
        );
        saveUserData(user.id, { symptomHistory: history, familiarityScore: newScore });
        // 刷新首頁圓環（若首頁已渲染）
        renderFamiliarityChart();
        // Sub-Task 8：段位升段偵測 & 成就檢查
        checkRankUp(oldScore, newScore);
        checkAchievements(getCurrentUser());
      }
    }

    /** 關閉出示卡 Modal */
    function closeCardModal() {
      document.getElementById('card-modal').classList.remove('open');
    }

    /** 初始化問診卡 Tab（切換時呼叫）*/
    function initSymptomView() {
      _sx.partId = null;
      _sx.selectedIds = new Set();
      renderSymptomStep1();
    }

    /* ═══════════════════════════════════════════════════════════
       Sub-Task 5 — 勞工權益速查模組
    ═══════════════════════════════════════════════════════════ */

    /**
     * 6 個分類的 metadata（emoji、lang key、id）
     */
    const LABOR_CATEGORIES = [
      { id: 'wage',     emoji: '💰', labelKey: 'laborCategoryWage'     },
      { id: 'hours',    emoji: '⏰', labelKey: 'laborCategoryHours'    },
      { id: 'leave',    emoji: '🏖', labelKey: 'laborCategoryLeave'    },
      { id: 'safety',   emoji: '⛑',  labelKey: 'laborCategorySafety'  },
      { id: 'document', emoji: '📄', labelKey: 'laborCategoryDocument' },
      { id: 'other',    emoji: '❓', labelKey: 'laborCategoryOther'    },
    ];

    /**
     * renderLaborCategories()
     * 渲染 6 張分類大卡片（兩欄格狀）。
     */
    function renderLaborCategories() {
      const inner = document.getElementById('labor-inner');
      if (!inner) return;
      const lang = getCurrentLang();

      const cardsHtml = LABOR_CATEGORIES.map(cat => `
        <button class="category-card" data-category="${cat.id}" aria-label="${t(cat.labelKey)}">
          <span class="category-card-emoji">${cat.emoji}</span>
          <span class="category-card-name">${t(cat.labelKey)}</span>
          <span class="category-card-count">${t('laborQuestionCount')}</span>
        </button>
      `).join('');

      inner.innerHTML = `
        <div class="labor-view-title">${t('laborTitle')}</div>
        <p style="font-size:.82rem;color:var(--color-muted);margin-bottom:.9rem;">${t('laborSelectCategory')}</p>
        <div class="category-grid" id="labor-category-grid">
          ${cardsHtml}
        </div>`;

      // 點擊分類卡片 → 進入問題列表
      inner.querySelectorAll('.category-card').forEach(btn => {
        btn.addEventListener('click', function() {
          renderLaborQuestions(this.dataset.category);
        });
      });
    }

    /**
     * renderLaborQuestions(category)
     * 渲染該分類的 4 題手風琴列表（含麵包屑）。
     */
    function renderLaborQuestions(category) {
      const inner = document.getElementById('labor-inner');
      if (!inner) return;

      const lang   = getCurrentLang();
      const user   = getCurrentUser();
      const catMeta = LABOR_CATEGORIES.find(c => c.id === category);
      if (!catMeta) return;

      const questions = LABOR_QA.filter(q => q.category === category);
      const progress  = (user && user.laborProgress) ? user.laborProgress : {};

      // 合法判斷 badge class & 文字
      function legalBadgeHtml(isLegal) {
        const map = {
          yes:   { cls: 'legal',   key: 'laborLegal'     },
          no:    { cls: 'illegal', key: 'laborIllegal'   },
          check: { cls: 'check',   key: 'laborNeedCheck' },
        };
        const info = map[isLegal] || map['check'];
        return `<span class="legal-badge ${info.cls}">${t(info.key)}</span>`;
      }

      // 行動按鈕 HTML
      function actionBtnsHtml(actions) {
        return actions.map(action => {
          const label = action.label[lang] || action.label.zh;
          if (action.type === 'tel') {
            return `<a href="tel:${action.value}" class="action-btn action-btn-tel">${label}</a>`;
          }
          return `<a href="${action.value}" target="_blank" rel="noopener" class="action-btn action-btn-url">${label}</a>`;
        }).join('');
      }

      // 手風琴項目 HTML
      const itemsHtml = questions.map(q => {
        const isRead   = !!(progress[q.id] && progress[q.id].read);
        const readBadge = isRead ? `<span class="question-read-badge">${t('laborRead')}</span>` : '';
        const qText    = q.q[lang] || q.q.zh;
        const aText    = q.a[lang] || q.a.zh;
        const evidenceItems = q.evidence.map(e => `<li>${e}</li>`).join('');

        return `
          <div class="question-item" data-qid="${q.id}">
            <div class="question-header" role="button" aria-expanded="false" tabindex="0">
              <span class="question-header-text">${qText}</span>
              ${readBadge}
              <span class="question-chevron">›</span>
            </div>
            <div class="question-content" aria-hidden="true">
              ${legalBadgeHtml(q.isLegal)}
              <p class="question-answer">${aText}</p>
              <div class="evidence-box">
                <div class="evidence-box-title">${t('laborEvidenceTitle')}</div>
                <ul class="evidence-list">${evidenceItems}</ul>
              </div>
              <div class="action-btns">${actionBtnsHtml(q.actions)}</div>
            </div>
          </div>`;
      }).join('');

      inner.innerHTML = `

    /**
     * markQuestionRead(questionId)
     * 寫入 user.laborProgress，重算 familiarityScore，刷新進度環。
     */
    function markQuestionRead(questionId) {
      const user = getCurrentUser();
      if (!user) return;

      // 若已標記則不重複寫入
      const progress = user.laborProgress || {};
      if (progress[questionId] && progress[questionId].read) return;

      progress[questionId] = { read: true, readAt: Date.now() };
      const updatedUser = Object.assign({}, user, { laborProgress: progress });
      const oldScore    = user.familiarityScore || 0;
      const newScore    = calcFamiliarityScore(updatedUser);

      saveUserData(user.id, { laborProgress: progress, familiarityScore: newScore });

      // 刷新首頁進度環（若首頁已渲染）
      renderFamiliarityChart();
      // Sub-Task 8：段位升段偵測 & 成就檢查
      checkRankUp(oldScore, newScore);
      checkAchievements(getCurrentUser());

      // 更新當前問題項目的已讀標記
      const item = document.querySelector(`.question-item[data-qid="${questionId}"]`);
      if (item) {
        let readBadgeEl = item.querySelector('.question-read-badge');
        if (!readBadgeEl) {
          readBadgeEl = document.createElement('span');
          readBadgeEl.className = 'question-read-badge';
          const chevron = item.querySelector('.question-chevron');
          item.querySelector('.question-header').insertBefore(readBadgeEl, chevron);
        }

    /**
     * _makeLocIcon(type)
     * 建立彩色圓形 divIcon
     */
    function _makeLocIcon(type) {
      const cfg = MAP_TYPE_CONFIG[type] || { color: '#718096', label: '?' };
      return L.divIcon({
        className: '',
        html: `<div style="
          width:30px;height:30px;border-radius:50%;

          display:flex;align-items:center;justify-content:center;

    /**
     * _makeUserIcon()
     * 使用者位置藍色 divIcon
     */
    function _makeUserIcon() {
      return L.divIcon({
        className: '',
        html: `<div style="
          width:18px;height:18px;border-radius:50%;
          background:#2563eb;
          border:3px solid #fff;

          "></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    /**
     * _distKm(lat1, lng1, lat2, lng2)
     * Haversine 距離（公里）
     */
    function _distKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 +
                Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    /**
     * _buildPopupHtml(loc)
     * 建立 Popup HTML：名稱、電話、語言 badge、開放時間

    function _buildPopupHtml(loc) {
      const lang = getCurrentLang();
      const name = loc.names[lang] || loc.names.zh;
      const cfg  = MAP_TYPE_CONFIG[loc.type] || {};

      const langBadges = (loc.languages || []).map(l =>

          background:rgba(0,0,0,.07);font-size:.7rem;font-weight:700;margin:1px;">${l.toUpperCase()}</span>`
      ).join('');

      return `
        <div style="min-width:200px;font-family:var(--font-main);">
          <div style="font-size:.92rem;font-weight:800;color:${cfg.color || '#333'};margin-bottom:.3rem;">${name}</div>
          <div style="font-size:.76rem;color:#555;margin-bottom:.25rem;">📍 ${loc.address}</div>
          <div style="font-size:.76rem;color:#555;margin-bottom:.3rem;">🕐 ${loc.hours}</div>
          <div style="margin-bottom:.35rem;">${langBadges}</div>
          <a href="tel:${loc.phone}" style="display:inline-block;padding:.3rem .75rem;
            background:${cfg.color || '#FF6B35'};color:#fff;border-radius:8px;
            font-size:.82rem;font-weight:700;text-decoration:none;">📞 ${loc.phone}</a>
        </div>`;
    }

    /**
     * initMap()
     * 初始化 Leaflet 地圖，優先使用 user.lastLocation，否則高雄市中心
     */
    function initMap() {
      if (_mapState.initialized) return;
      if (typeof L === 'undefined') {
        const listEl = document.getElementById('map-location-list');
        if (listEl) listEl.innerHTML = `<p style="padding:1rem;color:var(--color-muted);">${t('mapOffline')}</p>`;
        return;
      }

      const user = getCurrentUser();
      const defaultCenter = [22.6273, 120.3014];
      let center = defaultCenter;
      if (user && user.lastLocation && user.lastLocation.lat) {
        center = [user.lastLocation.lat, user.lastLocation.lng];
      }

      const map = L.map('leaflet-map', {
        center: center,
        zoom: 12,
        zoomControl: true
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      _mapState.map = map;
      _mapState.initialized = true;

      // 建立所有 marker（與 LOCATIONS 一一對應）
      LOCATIONS.forEach((loc, i) => {
        const marker = L.marker([loc.lat, loc.lng], { icon: _makeLocIcon(loc.type) })
          .addTo(map)
          .bindPopup(_buildPopupHtml(loc), { maxWidth: 260 });

        const circle = L.circle([loc.lat, loc.lng], {
          radius: 200,
          color: MAP_TYPE_CONFIG[loc.type]?.color || '#888',
          fillColor: MAP_TYPE_CONFIG[loc.type]?.color || '#888',
          fillOpacity: 0.12,
          weight: 1.5
        }).addTo(map);

        _mapState.markers.push(marker);
        _mapState.circles.push(circle);
      });

      // 渲染機構列表（預設全部）
      renderLocationList('all');
    }

    /**
     * renderMapMarkers(filter)
     * 根據 filter 顯示 / 隱藏對應的 marker 與圓圈
     * filter: 'all' | 'medical' | 'legal' | 'newcomer'
     */
    function renderMapMarkers(filter) {
      LOCATIONS.forEach((loc, i) => {
        const show = filter === 'all' || loc.type === filter;
        const marker = _mapState.markers[i];
        const circle = _mapState.circles[i];
        if (!marker || !circle) return;
        if (show) {
          if (!_mapState.map.hasLayer(marker)) marker.addTo(_mapState.map);
          if (!_mapState.map.hasLayer(circle)) circle.addTo(_mapState.map);
          // 更新 popup 語言
          marker.setPopupContent(_buildPopupHtml(loc));
        } else {
          if (_mapState.map.hasLayer(marker)) _mapState.map.removeLayer(marker);
          if (_mapState.map.hasLayer(circle)) _mapState.map.removeLayer(circle);
        }
      });
    }

    /**
     * renderLocationList(filter, nearbyIds)
     * 渲染底部機構列表
     * nearbyIds: Set<string>（選填），此 id 的卡片標示為「最近」
     */
    function renderLocationList(filter, nearbyIds) {
      const listEl = document.getElementById('map-location-list');
      if (!listEl) return;

      const lang = getCurrentLang();
      const nearby = nearbyIds || new Set();

      // 若有 nearby 機構，先顯示 nearby 標題 + nearby 機構
      let nearbyHtml = '';
      let mainList = LOCATIONS;

      if (nearby.size > 0) {
        const nearbyItems = LOCATIONS.filter(loc => nearby.has(loc.id));
        const nearbyCards = nearbyItems.map(loc => _locationCardHtml(loc, lang, true)).join('');
        nearbyHtml = `<p class="map-nearby-label">${t('mapNearby')}</p>${nearbyCards}`;
        mainList = LOCATIONS.filter(loc =>
          (filter === 'all' || loc.type === filter) && !nearby.has(loc.id)
        );
      } else {
        mainList = LOCATIONS.filter(loc => filter === 'all' || loc.type === filter);
      }

      const mainCards = mainList.map(loc => _locationCardHtml(loc, lang, false)).join('');
      listEl.innerHTML = nearbyHtml + mainCards;

      // 卡片點擊：flyTo + 開啟 popup
      listEl.querySelectorAll('.location-card').forEach(card => {
        card.addEventListener('click', function() {
          const id  = this.dataset.locId;
          const idx = LOCATIONS.findIndex(l => l.id === id);
          if (idx === -1 || !_mapState.map) return;
          const loc = LOCATIONS[idx];
          _mapState.map.flyTo([loc.lat, loc.lng], 16, { duration: 0.8 });
          setTimeout(() => _mapState.markers[idx] && _mapState.markers[idx].openPopup(), 900);
        });

    /**
     * setMapFilter(filter)
     * 切換篩選 Tab，更新 marker 與列表

      _mapState.currentFilter = filter;
      // 更新 Tab active 狀態
      document.querySelectorAll('.map-filter-tab').forEach(btn => {

    /**
     * locateMe()
     * 使用 Geolocation API 定位，儲存至 user，更新地圖與列表
     */
    function locateMe() {
      if (!navigator.geolocation) {
        alert(t('mapOffline'));
        return;
      }
      const btn = document.getElementById('map-locate-btn');
      if (btn) { btn.disabled = true; btn.style.opacity = '.7'; }

      navigator.geolocation.getCurrentPosition(
        function(pos) {
          if (btn) { btn.disabled = false; btn.style.opacity = ''; }
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;

          if (!_mapState.map) return;

          // 跳至使用者位置
          _mapState.map.flyTo([lat, lng], 14, { duration: 1 });

          // 移除舊 userMarker，建立新的
          if (_mapState.userMarker) _mapState.map.removeLayer(_mapState.userMarker);
          _mapState.userMarker = L.marker([lat, lng], { icon: _makeUserIcon(), zIndexOffset: 1000 })
            .addTo(_mapState.map)
            .bindPopup('📍 你的位置')
            .openPopup();

          // 儲存至 user.lastLocation
          const user = getCurrentUser();
          if (user) {
            saveUserData(user.id, {
              lastLocation: { lat, lng, timestamp: Date.now() }
            });
            // 更新首頁最近位置
            renderFamiliarityChart();
          }

          // 計算最近 3 個機構
          const sorted = LOCATIONS
            .map(loc => ({ loc, dist: _distKm(lat, lng, loc.lat, loc.lng) }))
            .sort((a, b) => a.dist - b.dist)
            .slice(0, 3);

          const nearbyIds = new Set(sorted.map(x => x.loc.id));
          renderLocationList(_mapState.currentFilter, nearbyIds);

          // 滾到列表頂部
          const listEl = document.getElementById('map-location-list');
          if (listEl) listEl.scrollTop = 0;
        },
        function() {
          if (btn) { btn.disabled = false; btn.style.opacity = ''; }
          alert(t('mapOffline'));
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    /**
     * calcStreakDays(user)
     * 從 landmarksVisited 取出唯一日期字串，計算最長連續天數。
     */
    function calcStreakDays(user) {
      const visited = (user.gameStats && user.gameStats.landmarksVisited) || [];
      if (visited.length === 0) return 0;

      // 收集唯一日期（yyyy-mm-dd 字串）
      const days = [...new Set(
        visited.map(v => new Date(v.ts).toLocaleDateString('sv-SE'))
      )].sort();

      if (days.length === 0) return 0;

      let maxStreak = 1;
      let cur = 1;
      for (let i = 1; i < days.length; i++) {
        const prev = new Date(days[i - 1]);
        const curr = new Date(days[i]);
        const diff = (curr - prev) / 86400000; // ms → 天
        if (diff === 1) {
          cur++;
          if (cur > maxStreak) maxStreak = cur;
        } else {
          cur = 1;
        }
      }
      return maxStreak;
    }

    /**
     * hasPerfectGame(user)
     * 檢查 gameStats.hasPerfect 旗標。
     */
    function hasPerfectGame(user) {
      return !!(user.gameStats && user.gameStats.hasPerfect);
    }

    /* ---- 10 個成就定義 ---- */

      { id: 'first_game',     emoji: '🎮', condition: u => (u.gameStats.totalPlayed  || 0) >= 1 },
      { id: 'first_card',     emoji: '💊', condition: u => (u.symptomHistory.length  || 0) >= 1 },

      { id: 'labor_master',   emoji: '🏛', condition: u => Object.keys(u.laborProgress).length >= 24 },
      { id: 'landmark_3',     emoji: '📍', condition: u => new Set((u.gameStats.landmarksVisited || []).map(v => v.id)).size >= 3 },
      { id: 'landmark_all',   emoji: '🗺', condition: u => new Set((u.gameStats.landmarksVisited || []).map(v => v.id)).size >= 13 },
      { id: 'score_40',       emoji: '🌳', condition: u => (u.familiarityScore || 0) >= 40 },
      { id: 'score_80',       emoji: '🏆', condition: u => (u.familiarityScore || 0) >= 80 },
      { id: 'streak_3',       emoji: '🔥', condition: u => calcStreakDays(u) >= 3 },

    ];

    /* ---- 主要成就函式 ---- */

    /**
     * checkAchievements(user)
     * 掃描所有成就條件，新解鎖的逐一慶祝並存檔，最後重新渲染格子。
     */
    function checkAchievements(user) {
      if (!user) return;

      const alreadyIds = ((user.gameStats && user.gameStats.achievements) || []).map(a => a.id);
      const newlyUnlocked = [];

      for (const ach of ACHIEVEMENTS) {
        if (alreadyIds.includes(ach.id)) continue;
        try {
          if (ach.condition(user)) newlyUnlocked.push(ach);
        } catch (_) { /* 欄位不齊全時跳過 */ }
      }

      if (newlyUnlocked.length > 0) {
        const achievements = [...(user.gameStats.achievements || [])];
        const now = Date.now();
        newlyUnlocked.forEach(a => achievements.push({ id: a.id, unlockedAt: now }));
        saveUserData(user.id, {
          gameStats: Object.assign({}, user.gameStats, { achievements })
        });
        // 逐一排隊顯示（使用 setTimeout 間隔）
        newlyUnlocked.forEach(function(a, i) {
          setTimeout(function() { showAchievementCelebration(a); }, i * 3600);
        });
      }
      renderAchievements();
    }

    /**
     * renderAchievements()
     * 渲染 #achievement-grid 的 10 個成就格子。
     */
    function renderAchievements() {
      const grid = document.getElementById('achievement-grid');
      if (!grid) return;

      const user = getCurrentUser();
      const unlockedMap = {};
      if (user && user.gameStats && user.gameStats.achievements) {
        user.gameStats.achievements.forEach(a => { unlockedMap[a.id] = a.unlockedAt; });
      }

      grid.innerHTML = ACHIEVEMENTS.map(ach => {
        const isUnlocked = ach.id in unlockedMap;
        const name = t('ach_' + ach.id);
        const cellClass = 'ach-cell ' + (isUnlocked ? 'unlocked' : 'locked');
        let tooltipHtml = '';
        if (isUnlocked) {
          const dateStr = new Date(unlockedMap[ach.id]).toLocaleDateString();
          tooltipHtml = `<span class="ach-tooltip">${t('achUnlockedAt')} ${dateStr}</span>`;
        }
        return `<div class="${cellClass}" tabindex="${isUnlocked ? '0' : '-1'}" aria-label="${name}${isUnlocked ? '' : ' (' + t('achLocked') + ')'}">
          <span class="ach-cell-emoji">${ach.emoji}</span>
          <span class="ach-cell-name">${name}</span>
          ${tooltipHtml}
        </div>`;
      }).join('');
    }

    function showAchievementCelebration(ach) {

    function checkRankUp(oldScore, newScore) {

    /* ═══════════════════════════════════════════════════════════
       Sub-Task 7 — 地標遊戲系統
    ═══════════════════════════════════════════════════════════ */

    /** GPS 掃描計時器 */
    let _gpsWatchInterval = null;

    /** 目前觸發遊戲的地標 & 題目 */
    let _currentGameLandmark = null;
    let _currentGameQuestion = null;

    /** 遊戲 B 排序狀態 */
    let _sortItems = [];

    /**
     * calcDistance(lat1, lng1, lat2, lng2)
     * Haversine 距離（公里），複用 _distKm 的邏輯
     */
    function calcDistance(lat1, lng1, lat2, lng2) {
      return _distKm(lat1, lng1, lat2, lng2);
    }

    /* ---- GPS 掃描服務 ---- */

    function startGpsWatch() {
      if (_gpsWatchInterval) return;
      _gpsWatchInterval = setInterval(scanNearbyLandmarks, 30000);
      scanNearbyLandmarks(); // 立即掃描一次
    }

    function stopGpsWatch() {
      if (_gpsWatchInterval) {
        clearInterval(_gpsWatchInterval);
        _gpsWatchInterval = null;
      }
      dismissToast();
    }

    function scanNearbyLandmarks() {
      const user = getCurrentUser();
      if (!user || !user.gameEnabled) return;
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(function(pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const today = new Date().toDateString();

        for (const loc of LOCATIONS) {
          if (!loc.isLandmark) continue;
          const dist = calcDistance(lat, lng, loc.lat, loc.lng);
          if (dist > 0.2) continue; // 200m

          // 檢查今天是否已觸發
          const freshUser = getCurrentUser(); // 重新讀取（避免 stale closure）
          const visited = (freshUser && freshUser.gameStats && freshUser.gameStats.landmarksVisited) || [];
          const already = visited.some(
            function(v) { return v.id === loc.id && new Date(v.ts).toDateString() === today; }
          );
          if (already) continue;

          showGameToast(loc);
          break; // 每次只觸發一個
        }
      }, null, { enableHighAccuracy: false, timeout: 10000 });
    }

    /* ---- Toast 通知條 ---- */

    function showGameToast(loc) {
      _currentGameLandmark = loc;
      const lang = getCurrentLang();
      const locName = loc.names[lang] || loc.names.zh;

      const toastEl  = document.getElementById('game-toast');
      const textEl   = document.getElementById('toast-text');
      const startBtn = document.getElementById('toast-start-btn');
      const dismissBtn = document.getElementById('toast-dismiss-btn');
      if (!toastEl) return;

      textEl.textContent   = t('gameToastTitle') + ' ' + locName;
      startBtn.textContent = t('gameStart');
      dismissBtn.textContent = t('gameClose');

      toastEl.classList.remove('hidden');
      // 讓 display:flex 先生效再加 visible，確保動畫正常觸發
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          toastEl.classList.add('visible');
        });
      });
    }

    function dismissToast() {
      const toastEl = document.getElementById('game-toast');
      if (!toastEl) return;
      toastEl.classList.remove('visible');
      // 等動畫結束再隱藏
      setTimeout(function() { toastEl.classList.add('hidden'); }, 350);
    }

    /* ---- 遊戲 Modal ---- */

    function openGameModal() {
      dismissToast();
      if (!_currentGameLandmark) return;
      launchGame(_currentGameLandmark.id);
      document.getElementById('game-modal').classList.remove('hidden');
    }

    function closeGameModal() {
      document.getElementById('game-modal').classList.add('hidden');
      document.getElementById('game-result').classList.add('hidden');
      document.getElementById('game-content').innerHTML = '';
    }

    /* ---- 遊戲主流程 ---- */

    function launchGame(landmarkId) {
      const lang = getCurrentLang();

      // 過濾該 landmark 的題目
      let pool = GAME_QUESTIONS.filter(function(q) { return q.landmark_id === landmarkId; });
      if (pool.length === 0) pool = GAME_QUESTIONS; // fallback：全部

      // 隨機選一題
      const q = pool[Math.floor(Math.random() * pool.length)];
      _currentGameQuestion = q;

      // 更新 Header
      const loc = _currentGameLandmark;
      if (loc) {
        const locName = loc.names[lang] || loc.names.zh;
        document.getElementById('game-landmark-name').textContent = t('gameLandmarkName') + '：' + locName;
      }
      document.getElementById('game-distance').textContent = '';
      document.getElementById('game-result').classList.add('hidden');

      // 依遊戲類型渲染
      if (q.type === 'A') renderGameA(q);
      else if (q.type === 'B') renderGameB(q);
      else renderGameC(q);
    }

    /* ---- 遊戲 A — 閃卡配對 ---- */

    function renderGameA(q) {
      const lang = getCurrentLang();
      const content = document.getElementById('game-content');
      if (!content) return;

      const optionsHtml = q.options.map(function(opt, i) {
        return '<button class="game-option-btn" data-idx="' + i + '">' +
          (opt[lang] || opt.zh) + '</button>';
      }).join('');

      content.innerHTML =
        '<div class="game-a-emoji">' + q.image_emoji + '</div>' +
        '<p class="game-a-question">' + (q.q[lang] || q.q.zh) + '</p>' +
        '<div class="game-options">' + optionsHtml + '</div>';

      content.querySelectorAll('.game-option-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.idx);
          const correct = idx === q.answer;
          // 標記所有按鈕
          content.querySelectorAll('.game-option-btn').forEach(function(b) {
            b.disabled = true;
            const bi = parseInt(b.dataset.idx);
            if (bi === q.answer) b.classList.add('correct');
            else if (bi === idx && !correct) b.classList.add('wrong');
          });
          submitAnswer(correct, q);
        });
      });
    }

    /* ---- 遊戲 B — 緊急排序 ---- */

    function renderGameB(q) {
      const lang = getCurrentLang();
      const content = document.getElementById('game-content');
      if (!content) return;

      // 初始化排序陣列（複製 items 陣列，隨機打亂）
      _sortItems = q.items.slice().sort(function() { return Math.random() - 0.5; });

      function buildSortHtml() {
        return _sortItems.map(function(item, i) {
          const label = item.label[lang] || item.label.zh;
          const upDis  = i === 0 ? ' disabled' : '';
          const dnDis  = i === _sortItems.length - 1 ? ' disabled' : '';
          return '<div class="game-sort-item" data-id="' + item.id + '">' +
            '<span class="game-sort-rank">' + (i + 1) + '</span>' +
            '<span class="game-sort-emoji">' + item.emoji + '</span>' +
            '<span class="game-sort-label">' + label + '</span>' +
            '<div class="game-sort-btns">' +
              '<button class="game-sort-btn btn-up"' + upDis + ' data-i="' + i + '">⬆️</button>' +
              '<button class="game-sort-btn btn-dn"' + dnDis + ' data-i="' + i + '">⬇️</button>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      function render() {
        content.innerHTML =
          '<p class="game-b-question">' + (q.q[lang] || q.q.zh) + '</p>' +
          '<p class="game-b-instruct">' + t('gameSortInstruct') + '</p>' +
          '<div class="game-sort-list" id="sort-list">' + buildSortHtml() + '</div>' +
          '<button class="btn-confirm-sort" id="btn-confirm-sort">' + t('gameConfirmSort') + '</button>';

        content.querySelectorAll('.btn-up').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const i = parseInt(this.dataset.i);
            if (i > 0) {
              const tmp = _sortItems[i - 1];
              _sortItems[i - 1] = _sortItems[i];
              _sortItems[i] = tmp;
              render();
            }
          });
        });
        content.querySelectorAll('.btn-dn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const i = parseInt(this.dataset.i);
            if (i < _sortItems.length - 1) {
              const tmp = _sortItems[i + 1];
              _sortItems[i + 1] = _sortItems[i];
              _sortItems[i] = tmp;
              render();
            }
          });
        });
        document.getElementById('btn-confirm-sort').addEventListener('click', function() {
          const userOrder = _sortItems.map(function(item) { return item.id; });
          const correct = JSON.stringify(userOrder) === JSON.stringify(q.answer);
          // 禁用所有按鈕
          content.querySelectorAll('.game-sort-btn').forEach(function(b) { b.disabled = true; });
          document.getElementById('btn-confirm-sort').disabled = true;
          submitAnswer(correct, q);
        });
      }

      render();
    }

    /* ---- 遊戲 C — 情境填空 ---- */

    function renderGameC(q) {
      const lang = getCurrentLang();
      const content = document.getElementById('game-content');
      if (!content) return;

      // 把 ___ 替換為 <span class="blank">___</span>
      const sentence = (q.sentence[lang] || q.sentence.zh)
        .replace('___', '<span class="blank">___</span>');

      const optionsHtml = q.options.map(function(opt, i) {
        return '<button class="game-c-option-btn" data-idx="' + i + '">' +
          (opt[lang] || opt.zh) + '</button>';
      }).join('');

      content.innerHTML =
        '<p class="game-c-instruct">' + t('gameFillInstruct') + '</p>' +
        '<div class="game-c-sentence">' + sentence + '</div>' +
        '<div class="game-c-options">' + optionsHtml + '</div>';

      content.querySelectorAll('.game-c-option-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.idx);
          const correct = idx === q.answer;
          content.querySelectorAll('.game-c-option-btn').forEach(function(b) {
            b.disabled = true;
            const bi = parseInt(b.dataset.idx);
            if (bi === q.answer) b.classList.add('correct');
            else if (bi === idx && !correct) b.classList.add('wrong');
          });
          // 若答對，填空格內容也更新
          const blankEl = content.querySelector('.blank');
          if (blankEl) {
            const chosen = q.options[idx];
            blankEl.textContent = chosen[lang] || chosen.zh;
          }
          submitAnswer(correct, q);
        });
      });
    }

    /* ---- 提交答案 & 更新統計 ---- */

    function submitAnswer(isCorrect, q) {
      const lang = getCurrentLang();
      const resultEl = document.getElementById('game-result');
      if (!resultEl) return;

      // 顯示結果 Banner
      const banner = isCorrect ? t('gameCorrect') : t('gameWrong');
      const bannerClass = isCorrect ? 'correct-banner' : 'wrong-banner';
      const explain = (q.explain && (q.explain[lang] || q.explain.zh)) || '';

      // 更新 user 資料
      const user = getCurrentUser();
      let scoreText = '';
      if (user) {
        const gs = user.gameStats || { totalPlayed: 0, totalCorrect: 0, landmarksVisited: [], achievements: [] };
        gs.totalPlayed  = (gs.totalPlayed  || 0) + 1;
        gs.totalCorrect = (gs.totalCorrect || 0) + (isCorrect ? 1 : 0);

        // perfect game 旗標：本局全對（totalCorrect === totalPlayed 且本次答對）
        if (isCorrect && gs.totalCorrect === gs.totalPlayed) {
          gs.hasPerfect = true;
        }

        // 記錄地標造訪（若本局對應地標且尚未記錄今天）
        if (_currentGameLandmark) {
          const today = new Date().toDateString();
          const visited = gs.landmarksVisited || [];
          const todayVisited = visited.some(function(v) {
            return v.id === _currentGameLandmark.id && new Date(v.ts).toDateString() === today;
          });
          if (!todayVisited) {
            visited.push({ id: _currentGameLandmark.id, ts: Date.now() });
            gs.landmarksVisited = visited;
          }
        }

        const updatedUser = Object.assign({}, user, { gameStats: gs });
        const oldScore = user.familiarityScore || 0;
        const newScore = calcFamiliarityScore(updatedUser);
        saveUserData(user.id, { gameStats: gs, familiarityScore: newScore });
        renderFamiliarityChart();
        // Sub-Task 8：段位升段偵測 & 成就檢查
        checkRankUp(oldScore, newScore);
        checkAchievements(getCurrentUser());

        scoreText = t('gameScore')
          .replace('{correct}', gs.totalCorrect)
          .replace('{total}',   gs.totalPlayed);
      }

      resultEl.innerHTML =
        '<div class="game-result-banner ' + bannerClass + '">' + banner + '</div>' +
        (explain ? '<div class="game-result-explain">' + explain + '</div>' : '') +
        (scoreText ? '<p class="game-result-score">' + scoreText + '</p>' : '') +
        '<p class="game-result-close-hint">3 秒後自動關閉…</p>';
      resultEl.classList.remove('hidden');

      // 捲動到結果區
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 3 秒後自動關閉
      setTimeout(function() { closeGameModal(); }, 3000);
    }

    /* ═══════════════════════════════════════════════════════════
       頁面載入
    ═══════════════════════════════════════════════════════════ */
    (function init() {
      const saved = localStorage.getItem('migrant_lang');
      const user  = getCurrentUser();

      // Sub-Task 4：出示卡 Modal 關閉按鈕 & 背景點擊關閉
      const cardModal = document.getElementById('card-modal');
      document.getElementById('card-modal-close').addEventListener('click', closeCardModal);
      cardModal.addEventListener('click', function(e) {
        if (e.target === cardModal) closeCardModal();
      });

      if (user) {
        // 已有登入狀態 → 直接進主頁
        applyLang();
        renderHomePage();
        showScreen('main-screen');
        // Sub-Task 7：若遊戲開啟，自動啟動 GPS 掃描
        if (user.gameEnabled !== false) {
          startGpsWatch();
        }
      } else if (saved && LANG_DATA[saved]) {
        applyLang();
        showScreen('auth-screen');
        renderUserList();
      } else {
        applyLang();
        showScreen('lang-screen');
      }
    })();
  </script>
